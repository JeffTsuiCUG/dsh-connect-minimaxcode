name: CI

# Runs on every push and pull request. Without this, a broken commit reaches
# main with nothing checking it, and the first signal is the publish job failing
# on a release — which is exactly when you least want to be debugging.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + test + build
      - run: pnpm run check
